[package]
name = "wavebreaker"
authors = ["m1nt_ (Rubber Duck Shobe)"]
description = "A custom, open-source server for Audiosurf 1"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/AudiosurfResearch/wavebreaker-rs"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
axum = { version = "0.8.9", features = ["macros", "tracing"] }
axum-serde = { version = "0.10.0", features = ["xml", "xml_encoding"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
num_enum = "0.7.6"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
diesel = { version = "2.3.14", features = ["time"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper"] }
steam-rs = "0.5.1"
steam-openid = "0.2.0"
time = { version = "0.3.55", features = ["formatting", "serde"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
toml = "1.1.8"
validator = { version = "0.21.0", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["form", "typed-header"] }
regex = "1.13.1"
musicbrainz_rs = { version = "0.14.0", features = ["rustls", "async", "rate_limit"], default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
tracing-appender = "0.2.5"
url = "2.5.8"
serde_urlencoded = "0.7.1"
fred = { version = "10.1.0", features = ["i-redis-json", "i-sorted-sets", "serde-json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "non_strict_integers", "repr", "time"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
serde-inline-default = "1.0.3"
serde_with = "3.24.0"
rand = "0.10.3"
sentry = { version = "0.49.3", features = ["tracing", "anyhow", "tower", "logs"] }
tower = "0.5.3"
futures = "0.3.34"
meilisearch-sdk = "0.33"
tokio-cron-scheduler = { version = "0.15.1", features = ["english"] }
